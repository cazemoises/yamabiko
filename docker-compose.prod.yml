# Produção — reaproveita a VM onde o Ascend já roda (mesma rede Docker
# externa `shared_net`, ver ../ascend/docker-compose.yml e BUILD_STATE.md
# pra decisão de arquitetura completa). Diferenças deliberadas em relação a
# docker-compose.yml (dev):
#   - Nenhum serviço publica porta no host (evita conflito com o postgres do
#     Ascend em 5432 e o redis em 6379, e não precisa de nenhuma mudança de
#     infra pedida ao responsável pela VM/Pangolin — tudo alcançável só via
#     rede Docker interna).
#   - Sem os volumes de certificado TLS (docker-compose.override.yml, só
#     dev/Tailscale) — em produção o TLS é terminado pelo Pangolin, o
#     core-api fala HTTP puro só dentro da rede Docker.
#   - Segredos vêm de `.env.prod` (não commitado, ver .env.prod.example)
#     em vez de valores fixos de dev.
#   - `core-api` é o único serviço yamabiko dual-homed: fica na rede default
#     deste projeto (fala com postgres/stt-service/voicevox/piper) E na
#     `shared_net` externa (pra o container `web`/nginx do Ascend alcançá-lo
#     como http://core-api:8080).
#
# Uso:
#   docker network create shared_net          # uma vez só, se ainda não existir
#   docker volume create yamabiko_web_dist     # uma vez só, se ainda não existir
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm web-static

services:
  stt-service:
    build: ./stt-service
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped

  piper:
    image: lscr.io/linuxserver/piper:latest
    environment:
      - PIPER_VOICE=en_US-lessac-high
    volumes:
      - piper-voices:/config
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yamabiko}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD precisa estar setado em .env.prod}
      - POSTGRES_DB=${POSTGRES_DB:-yamabiko}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yamabiko}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core-api:
    build: ./core-api
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-yamabiko}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD precisa estar setado em .env.prod}@postgres:5432/${POSTGRES_DB:-yamabiko}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET precisa estar setado em .env.prod}
      - PORT=8080
      - STT_SERVICE_URL=http://stt-service:8000
      - VOICEVOX_URL=http://voicevox:50021
      - PIPER_URL=piper:10200
      - AUDIO_CACHE_DIR=/app/audio-cache
      # Same-origin via nginx do Ascend (ver BUILD_STATE.md) — o browser
      # sempre fala com https://.../yamabiko-api/, nunca direto com este
      # serviço, então nenhum CORS_ALLOWED_ORIGINS é necessário em produção.
      - CORS_ALLOWED_ORIGINS=
      - CORS_ALLOW_LOCAL_NETWORK=false
    volumes:
      - audio-cache:/app/audio-cache
    depends_on:
      postgres:
        condition: service_healthy
      stt-service:
        condition: service_started
      voicevox:
        condition: service_started
      piper:
        condition: service_started
    restart: unless-stopped
    # `default` listado explicitamente porque adicionar `networks:` a um
    # serviço desliga a entrada automática na rede default do projeto — sem
    # isso o core-api perderia acesso a postgres/stt-service/voicevox/piper.
    networks:
      default:
      shared_net:

  # One-shot: builda o frontend (vite build, base '/yamabiko/', API relativa
  # a '/yamabiko-api/') e publica o dist/ no volume externo que o container
  # `web` do Ascend monta read-only em /usr/share/nginx/html/yamabiko (ver
  # ascend/docker-compose.yml). Não fica de pé — roda e sai. Rodar de novo
  # (`docker compose -f docker-compose.prod.yml run --rm web-static`) é o
  # único passo necessário pra publicar uma nova versão do frontend; nunca
  # exige rebuild/restart do container do Ascend.
  web-static:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_PATH: /yamabiko/
        VITE_API_BASE_URL: /yamabiko-api
    volumes:
      - yamabiko_web_dist:/out

volumes:
  whisper-models:
  postgres-data:
  audio-cache:
  piper-voices:
  # External — mesmo volume que ascend/docker-compose.yml monta read-only.
  yamabiko_web_dist:
    external: true

networks:
  default:
  # External — mesma rede que ascend/docker-compose.yml usa pro serviço `web`.
  shared_net:
    external: true
