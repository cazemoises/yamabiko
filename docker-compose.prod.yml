# Produção — VM compartilhada via Caddy (rede externa `shared-services`,
# ver infra-proxy/Caddyfile e docker network ls na VM). Diferenças
# deliberadas em relação a docker-compose.yml (dev):
#   - Nenhum serviço interno (postgres/stt-service/voicevox/piper) publica
#     porta no host — só alcançável via rede Docker interna do projeto.
#   - `core-api` e `web` são as únicas portas de entrada externas: ambos
#     entram na rede externa `shared-services` pra o Caddy alcançá-los por
#     nome de container.
#   - Sem os volumes de certificado TLS (docker-compose.override.yml, só
#     dev/Tailscale) — em produção o TLS é terminado pelo Caddy.
#   - Segredos (POSTGRES_PASSWORD, JWT_SECRET) vêm de variáveis de ambiente
#     do CI (GitHub Secrets), não de .env.prod nem de valores fixos de dev.
#   - `web` builda e serve o frontend via nginx próprio (Dockerfile.prod),
#     ao invés do esquema antigo de publicar num volume externo montado
#     pelo nginx de outro projeto (Ascend, que não roda nesta VM).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  stt-service:
    build: ./stt-service
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped

  piper:
    image: lscr.io/linuxserver/piper:latest
    environment:
      - PIPER_VOICE=en_US-lessac-high
    volumes:
      - piper-voices:/config
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-yamabiko}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD precisa estar setado}
      - POSTGRES_DB=${POSTGRES_DB:-yamabiko}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yamabiko}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  core-api:
    build: ./core-api
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-yamabiko}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD precisa estar setado}@postgres:5432/${POSTGRES_DB:-yamabiko}?sslmode=disable
      - PORT=8080
      - STT_SERVICE_URL=http://stt-service:8000
      - VOICEVOX_URL=http://voicevox:50021
      - PIPER_URL=piper:10200
      - AUDIO_CACHE_DIR=/app/audio-cache
      # Same-origin via Caddy (yamabiko.duckdns.org/api/* -> core-api) — o
      # browser nunca fala direto com este serviço, então nenhum
      # CORS_ALLOWED_ORIGINS é necessário em produção.
      - CORS_ALLOWED_ORIGINS=
      - CORS_ALLOW_LOCAL_NETWORK=false
    volumes:
      - audio-cache:/app/audio-cache
    depends_on:
      postgres:
        condition: service_healthy
      stt-service:
        condition: service_started
      voicevox:
        condition: service_started
      piper:
        condition: service_started
    restart: unless-stopped
    # `default` listado explicitamente porque adicionar `networks:` a um
    # serviço desliga a entrada automática na rede default do projeto — sem
    # isso o core-api perderia acesso a postgres/stt-service/voicevox/piper.
    networks:
      default:
      shared-services:

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.prod
      args:
        # ATUALIZADO: Prefixos ajustados para rodar na subpasta do portal
        VITE_BASE_PATH: /yamabiko/
        VITE_API_BASE_URL: /yamabiko/api
    restart: unless-stopped
    # HEALTHCHECK definido na imagem (ver web/Dockerfile.prod) — permite
    # checar `docker inspect --format='{{.State.Health.Status}}'`, mesmo
    # padrão usado no postgres acima, sem depender de wget/curl estarem
    # disponíveis via `docker compose exec` no momento da checagem.
    # Só precisa ser alcançável pelo Caddy — não fala com nenhum outro
    # serviço deste projeto (as chamadas de API saem do browser pro Caddy,
    # nunca container-a-container).
    networks:
      shared-services:

volumes:
  whisper-models:
  postgres-data:
  audio-cache:
  piper-voices:

networks:
  default:
  shared-services:
    external: true