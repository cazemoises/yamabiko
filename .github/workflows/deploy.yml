name: Deploy yamabiko

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux]
    env:
      POSTGRES_USER: yamabiko
      POSTGRES_DB: yamabiko
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Certificados Tailscale (.crt/.key) não são versionados (ver
          # .gitignore) e vivem no workspace do runner entre execuções.
          # clean padrão roda `git clean -ffdx`, que apagaria arquivos
          # ignorados a cada deploy — clean: false preserva o que já está lá.
          clean: false

      - name: Ensure external network exists
        run: |
          docker network inspect shared-services >/dev/null 2>&1 || docker network create shared-services

      - name: Build and start all services
        run: docker compose -f docker-compose.prod.yml up -d --build stt-service voicevox piper postgres core-api web

      - name: Health check - postgres
        run: |
          for i in $(seq 1 15); do
            cid=$(docker compose -f docker-compose.prod.yml ps -q postgres)
            status=$(docker inspect --format='{{.State.Health.Status}}' "$cid" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "postgres healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::postgres did not become healthy"
          docker compose -f docker-compose.prod.yml logs postgres
          exit 1

      - name: Health check - core-api
        run: |
          for i in $(seq 1 15); do
            if docker compose -f docker-compose.prod.yml exec -T core-api wget -qO- http://localhost:8080/health >/dev/null 2>&1; then
              echo "core-api healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::core-api did not become healthy"
          docker compose -f docker-compose.prod.yml logs core-api
          exit 1

      - name: Health check - web
        run: |
          for i in $(seq 1 15); do
            if docker compose -f docker-compose.prod.yml exec -T web wget -qO- http://localhost:80/ >/dev/null 2>&1; then
              echo "web healthy"; exit 0
            fi
            sleep 2
          done
          echo "::error::web did not become healthy"
          docker compose -f docker-compose.prod.yml logs web
          exit 1