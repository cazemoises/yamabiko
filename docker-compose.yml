services:
  stt-service:
    build: ./stt-service
    ports:
      - "8001:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface

  # VOICEVOX (motor de TTS japonês open-source) gera o áudio de referência de
  # pronúncia pros exercícios ja-JP (Sec. pedida pelo usuário). Variante CPU
  # (cpu-latest) porque não assumimos GPU disponível — mesma decisão de
  # stt-service/whisper_engine.py (device="cpu"). Sem `ports:` de propósito:
  # só o core-api precisa falar com ele, então fica só na rede interna do
  # compose (alcançável via `http://voicevox:50021`), sem expor porta no host.
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    expose:
      - "50021"

  # Piper (motor de TTS em inglês open-source) gera o áudio de referência dos
  # exercícios en-US, mesmo raciocínio do voicevox pra ja-JP. A imagem
  # empacota o wyoming-piper (baixa o modelo de voz automaticamente no 1º
  # start) e fala o protocolo Wyoming — TCP puro com framing JSON, não HTTP
  # (confirmado empiricamente: não responde a requisição HTTP nenhuma; ver
  # core-api/internal/tts/piper_client.go pro cliente). PIPER_VOICE fixa a
  # voz servida: en_US-lessac-medium é uma voz adulta neutra de qualidade
  # média-alta do catálogo oficial do Piper (nada de mascote, mesmo raciocínio
  # da escolha de speaker do voicevox). Volume próprio pro modelo baixado
  # persistir entre restarts, mesmo padrão do whisper-models. Sem `ports:` —
  # só o core-api fala com ele, fica só na rede interna do compose.
  piper:
    image: lscr.io/linuxserver/piper:latest
    environment:
      - PIPER_VOICE=en_US-lessac-medium
    volumes:
      - piper-voices:/config
    expose:
      - "10200"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=yamabiko
      - POSTGRES_PASSWORD=yamabiko
      - POSTGRES_DB=yamabiko
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamabiko"]
      interval: 3s
      timeout: 3s
      retries: 10

  core-api:
    build: ./core-api
    ports:
      - "9001:8080"
    environment:
      - DATABASE_URL=postgres://yamabiko:yamabiko@postgres:5432/yamabiko?sslmode=disable
      - JWT_SECRET=dev-secret-troque-em-producao
      - PORT=8080
      - STT_SERVICE_URL=http://stt-service:8000
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      - VOICEVOX_URL=http://voicevox:50021
      - VOICEVOX_SPEAKER_ID=30
      - PIPER_URL=piper:10200
      - PIPER_VOICE=en_US-lessac-medium
      - AUDIO_CACHE_DIR=/app/audio-cache
    volumes:
      - audio-cache:/app/audio-cache
    depends_on:
      postgres:
        condition: service_healthy
      stt-service:
        condition: service_started
      voicevox:
        condition: service_started
      piper:
        condition: service_started

volumes:
  whisper-models:
  postgres-data:
  audio-cache:
  piper-voices:
