services:
  stt-service:
    build: ./stt-service
    ports:
      - "8001:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface

  # VOICEVOX (motor de TTS japonês open-source) gera o áudio de referência de
  # pronúncia pros exercícios ja-JP (Sec. pedida pelo usuário). Variante CPU
  # (cpu-latest) porque não assumimos GPU disponível — mesma decisão de
  # stt-service/whisper_engine.py (device="cpu"). Sem `ports:` de propósito:
  # só o core-api precisa falar com ele, então fica só na rede interna do
  # compose (alcançável via `http://voicevox:50021`), sem expor porta no host.
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    expose:
      - "50021"

  # Piper (motor de TTS em inglês open-source) gera o áudio de referência dos
  # exercícios en-US, mesmo raciocínio do voicevox pra ja-JP. A imagem
  # empacota o wyoming-piper e fala o protocolo Wyoming — TCP puro com framing
  # JSON, não HTTP (confirmado empiricamente: não responde a requisição HTTP
  # nenhuma; ver core-api/internal/tts/piper_client.go pro cliente).
  # PIPER_VOICE fixa só a voz de arranque do container (a que ele baixa e
  # carrega antes de qualquer request) — o core-api pode pedir qualquer outro
  # modelo por nome via o campo "voice" da mensagem Wyoming (confirmado no
  # código-fonte de wyoming_piper: cada synthesize resolve a voz pedida e
  # baixa sob demanda se ainda não estiver em /config, cacheando pro resto da
  # vida do volume). 3 modelos curados, todos em qualidade "high" (curadoria
  # pedida pelo usuário, ver core-api/internal/tts/voice.go e
  # BUILD_STATE.md — trocados de "medium" pra "high" porque a qualidade
  # perceptível ficava nitidamente abaixo do VOICEVOX; trade-off de latência
  # documentado em BUILD_STATE.md):
  #   - en_US-lessac-high: voz masculina neutra (default, já em uso)
  #   - en_US-ryan-high: voz masculina jovem, timbre distinto do lessac
  #   - en_US-ljspeech-high: voz feminina (substitui a antiga en_US-amy-medium
  #     — amy não tem tier "high" no repositório oficial do Piper)
  # Volume próprio pros modelos baixados persistirem entre restarts, mesmo
  # padrão do whisper-models. Sem `ports:` — só o core-api fala com ele, fica
  # só na rede interna do compose.
  piper:
    image: lscr.io/linuxserver/piper:latest
    environment:
      - PIPER_VOICE=en_US-lessac-high
    volumes:
      - piper-voices:/config
    expose:
      - "10200"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=yamabiko
      - POSTGRES_PASSWORD=yamabiko
      - POSTGRES_DB=yamabiko
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamabiko"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Portas publicadas com a sintaxe curta "HOST:CONTAINER" (9001:8080 etc.)
  # já ficam acessíveis em TODAS as interfaces de rede do host, não só
  # 127.0.0.1 — é o default do Docker (precisaria de "127.0.0.1:9001:8080"
  # pra restringir a loopback, o que nenhum serviço aqui faz). Então dar
  # pra acessar o core-api de outro dispositivo na mesma rede Wi-Fi
  # (http://<IP-da-máquina>:9001) já funciona sem mudança nenhuma aqui —
  # só faltava o `web` escutar em 0.0.0.0 (ver vite.config.ts) e o CORS
  # aceitar esse origin (CORS_ALLOW_LOCAL_NETWORK abaixo).
  core-api:
    build: ./core-api
    ports:
      - "9001:8080"
    environment:
      - DATABASE_URL=postgres://yamabiko:yamabiko@postgres:5432/yamabiko?sslmode=disable
      - JWT_SECRET=dev-secret-troque-em-producao
      - PORT=8080
      - STT_SERVICE_URL=http://stt-service:8000
      # https://caze.tailc68a7f.ts.net:5173 é o hostname MagicDNS do
      # Tailscale desta máquina (Sec. pedida pelo usuário — acesso via HTTPS
      # real, necessário pro getUserMedia funcionar no Safari iOS, ver
      # BUILD_STATE.md). CORS_ALLOW_LOCAL_NETWORK (abaixo) NÃO cobre esse
      # origin: ele só aceita http:// (não https://) com host IP de rede
      # privada RFC1918 — o IP do Tailscale é CGNAT (100.64.0.0/10, RFC
      # 6598), fora do que net.IP.IsPrivate() considera privado, e aqui é um
      # hostname (MagicDNS), não IP literal, de qualquer forma. Por isso
      # precisa entrar explicitamente na whitelist estática.
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,https://caze.tailc68a7f.ts.net:5173
      # Dev-only (Sec. pedida pelo usuário — testar o `web` pelo celular na
      # mesma Wi-Fi): aceita qualquer origin http://<IP-de-rede-privada>,
      # SEM precisar fixar o IP da máquina aqui (ele muda a cada rede/DHCP
      # — ver corsOptions/isLocalNetworkOrigin em
      # core-api/internal/httpserver/router.go). Substitui a lista de IPs
      # fixos que estava aqui antes. NUNCA setar isso em produção — remover
      # esta linha (ou setar "false") desliga a feature, voltando pro
      # comportamento de só CORS_ALLOWED_ORIGINS.
      - CORS_ALLOW_LOCAL_NETWORK=true
      - VOICEVOX_URL=http://voicevox:50021
      - PIPER_URL=piper:10200
      - AUDIO_CACHE_DIR=/app/audio-cache
    volumes:
      - audio-cache:/app/audio-cache
    depends_on:
      postgres:
        condition: service_healthy
      stt-service:
        condition: service_started
      voicevox:
        condition: service_started
      piper:
        condition: service_started

volumes:
  whisper-models:
  postgres-data:
  audio-cache:
  piper-voices: