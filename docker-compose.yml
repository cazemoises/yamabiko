services:
  stt-service:
    build: ./stt-service
    ports:
      - "8001:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=yamabiko
      - POSTGRES_PASSWORD=yamabiko
      - POSTGRES_DB=yamabiko
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamabiko"]
      interval: 3s
      timeout: 3s
      retries: 10

  core-api:
    build: ./core-api
    ports:
      - "9001:8080"
    environment:
      - DATABASE_URL=postgres://yamabiko:yamabiko@postgres:5432/yamabiko?sslmode=disable
      - JWT_SECRET=dev-secret-troque-em-producao
      - PORT=8080
      - STT_SERVICE_URL=http://stt-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      stt-service:
        condition: service_started

volumes:
  whisper-models:
  postgres-data:
